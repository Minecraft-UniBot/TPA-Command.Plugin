org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-22.jdk/Contents/Home
org.gradle.jvmargs=-Xmx2g

# ===== 多版本支持配置 =====
# 编译所基于的 Minecraft API 版本（向下兼容：越低的版本，能运行的服务器越广）
# 这里使用 1.20.1 spigot-api 编译（依赖干净），配合 Java 8 目标 + apiVersion=1.13，
# 实际可在 1.13+ 全版本运行（代码仅使用 1.8 就存在的稳定 Bukkit API）。
mcVersion=1.20.1
# plugin.yml 中的 api-version，决定服务器允许的最低版本判定
# 1.13 是引入 api-version 的字段，1.8~1.12 服务器会忽略该字段
apiVersion=1.13
# Java 编译目标字节码版本（决定可在哪些 JVM 上加载）
# 1.13+ 的服务器均运行在 Java 8+，因此 Java 8 目标可覆盖全部 1.13+ 版本
javaTarget=8
# jar 产物版本号
pluginVersion=1.0.0